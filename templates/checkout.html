{% extends "base.html" %}
{% block content %}

<style>
  .checkout-wrap{ max-width: 980px; margin: 0 auto; }
  .checkout-card{
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(0,0,0,.05);
  }
  #formCard{ position: relative; z-index: 20; }

  .cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .cart-info{ flex: 1; min-width: 0; }
  .cart-info .fw-semibold{
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cart-item:last-child{ border-bottom: 0; }

  .qty-mini{
    display:flex; align-items:center; gap:10px;
    padding:6px 10px; border-radius:999px;
    border: 1px solid rgba(0,0,0,.10);
    background:#fff; min-width: 120px;
    justify-content: center;
  }

  .cart-price{
    min-width: 90px; text-align: right;
    font-weight: 700; white-space: nowrap;
    flex: 0 0 auto;
  }

  .cart-actions{ display:flex; gap:10px; margin-top: 14px; }

  @media (max-width: 992px){
    .cart-actions{ flex-direction: column; }
    .cart-price{ min-width: auto; }
    .qty-mini{ min-width: 108px; }
  }
</style>

<div class="checkout-wrap">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h4 class="mb-0"><i class="bi bi-basket3"></i> Finalizar pedido</h4>
      <div class="text-muted">Confira o carrinho e envie no WhatsApp</div>
    </div>
    <a class="btn btn-nc" href="{{ url_for('index') }}">
      <i class="bi bi-arrow-left"></i> Voltar
    </a>
  </div>

  <div class="row g-3">
    <!-- DADOS DO CLIENTE -->
    <div class="col-12 col-lg-6">
      <div class="checkout-card p-3" id="formCard">
        <h6 class="mb-3"><i class="bi bi-person-lines-fill"></i> Dados do cliente</h6>

        <div class="mb-2">
          <label class="form-label">Nome do cliente</label>
          <input class="form-control" id="customer_name" placeholder="Seu nome" required>
        </div>

        <div class="mb-2">
          <label class="form-label">Telefone / WhatsApp</label>
          <input class="form-control" id="phone" placeholder="(31) 99999-9999" required>
        </div>

        <div class="mb-2">
          <label class="form-label">Observação (opcional)</label>
          <input
